<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白白下一餐食D咩</title>
    <style>
        :root {
            --primary-color: #ff8fa3;
            --secondary-color: #ffb3c1;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #590d22;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 90px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(255, 143, 163, 0.3);
            border: 3px solid #ffccd5;
            position: relative;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #c9184a;
            font-size: 1.6rem;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #ff4d6d;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1rem;
            color: #a4133c;
            margin-top: 10px;
            margin-bottom: 12px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .menu-item {
            background: #fff0f3;
            border: 2px solid #ffccd5;
            border-radius: 15px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-item.selected {
            background: var(--secondary-color);
            border-color: #ff4d6d;
            color: white;
        }

        .menu-item img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .menu-item .name {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .btn-add {
            background: #ff8fa3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .menu-item.selected .btn-add {
            background: #ff4d6d;
        }

        /* 購物車懸浮按鈕 */
        .cart-float-btn {
            position: fixed;
            bottom: 20px;
            right: 50%;
            transform: translateX(50%);
            width: 90%;
            max-width: 440px;
            background: linear-gradient(135deg, #ff758f, #ff4d6d);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        /* 購物車彈窗 Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #fff0f3;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.3rem;
            color: #c9184a;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #aaa;
            cursor: pointer;
        }

        .cart-item-list {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #ffccd5;
        }

        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item-img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
        }

        .remove-btn {
            background: #ffb3c1;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .custom-input {
            width: 100%;
            padding: 12px;
            border: 2px dashed #ff8fa3;
            border-radius: 15px;
            box-sizing: border-box;
            outline: none;
            font-size: 0.95rem;
            background: #fff8f9;
            color: var(--text-color);
            resize: none;
            margin-top: 10px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ff758f, #ff4d6d);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .empty-cart-text {
            text-align: center;
            color: #ff8fa3;
            padding: 20px 0;
        }

        .loading-text {
            text-align: center;
            grid-column: span 2;
            color: #ff758f;
            padding: 20px;
        }

        /* 成功頁面樣式 */
        .success-page {
            display: none;
            text-align: center;
        }

        .success-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .order-summary-box {
            background: #fff0f3;
            border: 2px dashed #ff8fa3;
            border-radius: 18px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }

        .order-summary-title {
            font-weight: bold;
            color: #c9184a;
            border-bottom: 1px solid #ffccd5;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .order-detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .order-detail-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        .wish-text {
            background: #ffffff;
            padding: 10px;
            border-radius: 10px;
            color: #a4133c;
            font-size: 0.9rem;
            margin-top: 8px;
            word-break: break-all;
        }

        .btn-add-more {
            width: 100%;
            background: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
            padding: 12px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<!-- 1. 點餐主頁面 -->
<div class="container" id="mainPage">
    <h1>白白下一餐食D咩</h1>
    <div class="subtitle">想食乜嘢？撳選項加進購物車或者寫低許願想法！</div>

    <div class="section-title">🍱 今日特供菜單</div>
    <div class="menu-grid" id="menuGrid">
        <div class="loading-text">毛毛大廚正在為您加載今日菜單... 🍳</div>
    </div>
</div>

<!-- 底部懸浮購物車按鈕 -->
<button class="cart-float-btn" id="cartFloatBtn" onclick="openCart()">
    <span>🛒 查看購物車</span>
    <div>
        <span id="cartCount">已選 0 項</span>
    </div>
</button>

<!-- 購物車彈窗 Modal -->
<div class="modal-overlay" id="cartModal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title">🛍️ 白白嘅購物車</span>
            <button class="close-btn" onclick="closeCart()">&times;</button>
        </div>

        <div id="cartItemsContainer">
            <div class="empty-cart-text">購物車仲係空的喔！快啲揀幾樣心水菜式啦～ 💕</div>
        </div>

        <div class="section-title" style="margin-top: 15px;">✨ 額外許願池</div>
        <textarea id="customWish" class="custom-input" rows="3" placeholder="今天特別想食D乜？例如：想飲一杯萬波...（唔可以）"></textarea>

        <button class="btn-submit" id="submitBtn" onclick="submitOrder()">💖 送出菜單比毛毛大廚</button>
    </div>
</div>

<!-- 2. 下單成功明細頁面 -->
<div class="container success-page" id="successPage">
    <div class="success-icon">🎉</div>
    <h1>點餐成功！</h1>
    <div class="subtitle">毛毛大廚已收到你嘅菜單，即刻為您準備！👩‍🍳❤️</div>

    <div class="order-summary-box">
        <div class="order-summary-title">📋 本次已點菜單</div>
        <div id="submittedItemsList"></div>
        
        <div class="order-summary-title" style="margin-top: 15px;">✨ 特別許願內容</div>
        <div id="submittedWish" class="wish-text">無</div>
    </div>

    <button class="btn-add-more" onclick="backToMenu()">➕ 仲想加菜 / 重新點餐</button>
</div>

<script>
    const FORMSPREE_URL = "https://formspree.io/f/xbgjpddy"; 
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vROrrUIUq4xb815GEfQrz4ucj2unIsnmpahYl_q_Rne3VgguQxUME4jM0yS0nzUSalPi-ir9VfdfMEa/pub?output=csv";

    let menuItems = [];
    let selectedItems = [];

    // 從 Google 試算表讀取菜單 CSV
    async function loadMenuFromSheet() {
        try {
            const response = await fetch(SHEET_CSV_URL);
            const data = await response.text();
            
            const rows = data.split('\n').map(row => row.trim()).filter(row => row.length > 0);
            menuItems = [];

            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].split(',');
                if (cols[0]) {
                    menuItems.push({
                        name: cols[0].replace(/^"|"$/g, '').trim(),
                        img: cols[1] ? cols[1].replace(/^"|"$/g, '').trim() : ''
                    });
                }
            }
            renderMenu();
        } catch (error) {
            console.error("加載菜單失敗:", error);
            document.getElementById('menuGrid').innerHTML = '<div class="loading-text">菜單加載失敗，請稍後再試！</div>';
        }
    }

    // 渲染主頁菜單
    function renderMenu() {
        const grid = document.getElementById('menuGrid');
        grid.innerHTML = '';

        if (menuItems.length === 0) {
            grid.innerHTML = '<div class="loading-text">今天大廚休息或仲未有菜品揀喔！</div>';
            return;
        }

        menuItems.forEach((item) => {
            const isSelected = selectedItems.some(i => i.name === item.name);
            const div = document.createElement('div');
            div.className = `menu-item ${isSelected ? 'selected' : ''}`;
            div.onclick = () => toggleSelect(item);
            
            const imgHtml = item.img ? `<img src="${item.img}" alt="${item.name}">` : '';
            const btnText = isSelected ? '✓ 已加進購物車' : '+ 加進購物車';
            
            div.innerHTML = `
                <div>
                    ${imgHtml}
                    <div class="name">${item.name}</div>
                </div>
                <button class="btn-add">${btnText}</button>
            `;
            grid.appendChild(div);
        });

        updateCartUI();
    }

    // 切換選取狀態
    function toggleSelect(item) {
        const index = selectedItems.findIndex(i => i.name === item.name);
        if (index > -1) {
            selectedItems.splice(index, 1);
        } else {
            selectedItems.push(item);
        }
        renderMenu();
    }

    // 更新購物車顯示介面
    function updateCartUI() {
        document.getElementById('cartCount').innerText = `已選 ${selectedItems.length} 項`;
        
        const container = document.getElementById('cartItemsContainer');
        if (selectedItems.length === 0) {
            container.innerHTML = '<div class="empty-cart-text">購物車仲係空的喔！快啲揀幾樣心水菜式啦～ 💕</div>';
            return;
        }

        let html = '<ul class="cart-item-list">';
        selectedItems.forEach((item) => {
            const imgHtml = item.img ? `<img src="${item.img}" class="cart-item-img">` : '';
            html += `
                <li class="cart-item">
                    <div class="cart-item-info">
                        ${imgHtml}
                        <span>${item.name}</span>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart('${item.name}')">刪除</button>
                </li>
            `;
        });
        html += '</ul>';
        container.innerHTML = html;
    }

    // 從購物車內刪除指定菜色
    function removeFromCart(itemName) {
        selectedItems = selectedItems.filter(i => i.name !== itemName);
        renderMenu();
    }

    // 開啟/關閉購物車 Modal
    function openCart() {
        document.getElementById('cartModal').style.display = 'flex';
    }

    function closeCart() {
        document.getElementById('cartModal').style.display = 'none';
    }

    // 點擊彈窗外部關閉
    window.onclick = function(event) {
        const modal = document.getElementById('cartModal');
        if (event.target === modal) {
            closeCart();
        }
    }

    // 送出訂單
    async function submitOrder() {
        const customWish = document.getElementById('customWish').value.trim();

        if (selectedItems.length === 0 && !customWish) {
            alert("bb豬，你仲未揀任何想食嘅嘢喔！揀一個喇～ 💕");
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "傳送緊比大廚... 💌";

        const selectedNames = selectedItems.map(i => i.name).join(", ");

        try {
            const response = await fetch(FORMSPREE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "選取的菜餚": selectedNames || "無",
                    "特別許願": customWish || "無",
                    "點餐時間": new Date().toLocaleString()
                })
            });

            if (response.ok) {
                // 渲染成功頁面的內容
                showSuccessPage(customWish);
            } else {
                alert("傳送失敗，請試多一次睇下先～");
            }
        } catch (error) {
            alert("網路連線有問題，請稍後再試！");
        } finally {
            btn.disabled = false;
            btn.innerText = "💖 送出菜單比毛毛大廚";
        }
    }

    // 顯示成功頁面
    function showSuccessPage(wishText) {
        // 渲染已點餐點
        const itemsListContainer = document.getElementById('submittedItemsList');
        if (selectedItems.length > 0) {
            let html = '';
            selectedItems.forEach(item => {
                const imgHtml = item.img ? `<img src="${item.img}" class="order-detail-img">` : '';
                html += `
                    <div class="order-detail-item">
                        ${imgHtml}
                        <span>${item.name}</span>
                    </div>
                `;
            });
            itemsListContainer.innerHTML = html;
        } else {
            itemsListContainer.innerHTML = '<div style="color: #666; font-size: 0.9rem;">未選擇固定菜色</div>';
        }

        // 渲染許願內容
        document.getElementById('submittedWish').innerText = wishText || "無特別許願內容～";

        // 關閉購物車並切換頁面
        closeCart();
        document.getElementById('mainPage').style.display = 'none';
        document.getElementById('cartFloatBtn').style.display = 'none';
        document.getElementById('successPage').style.display = 'block';
    }

    // 返回點餐主頁（加菜）
    function backToMenu() {
        document.getElementById('successPage').style.display = 'none';
        document.getElementById('mainPage').style.display = 'block';
        document.getElementById('cartFloatBtn').style.display = 'flex';
        
        // 清空當前選取，重新點餐
        selectedItems = [];
        document.getElementById('customWish').value = '';
        renderMenu();
    }

    // 初始化
    loadMenuFromSheet();
</script>

</body>
</html>
