<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白白下一餐食D咩</title>
    <style>
        :root {
            --primary-color: #ff8fa3;
            --secondary-color: #ffb3c1;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #590d22;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 90px;
            display: flex;
            justify-content: center;
        }

        /* 全局右上角固定貼圖 */
        .fixed-sticker {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
            pointer-events: none; /* 避免遮擋點擊 */
            animation: bounce 2s infinite ease-in-out;
        }

        .fixed-sticker img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            filter: drop-shadow(0px 4px 8px rgba(255, 117, 143, 0.4));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(255, 143, 163, 0.3);
            border: 3px solid #ffccd5;
            position: relative;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #c9184a;
            font-size: 1.6rem;
            margin-bottom: 5px;
            padding-right: 20px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #ff4d6d;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1rem;
            color: #a4133c;
            margin-top: 10px;
            margin-bottom: 12px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .menu-item {
            background: #fff0f3;
            border: 2px solid #ffccd5;
            border-radius: 15px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-item.selected {
            background: var(--secondary-color);
            border-color: #ff4d6d;
            color: white;
        }

        .menu-item.locked {
            border-color: #ff758f;
            opacity: 0.85;
        }

        .menu-item img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .menu-item .name {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .btn-add {
            background: #ff8fa3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .menu-item.selected .btn-add {
            background: #ff4d6d;
        }

        /* 購物車懸浮按鈕 */
        .cart-float-btn {
            position: fixed;
            bottom: 20px;
            right: 50%;
            transform: translateX(50%);
            width: 90%;
            max-width: 440px;
            background: linear-gradient(135deg, #ff758f, #ff4d6d);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        /* 購物車彈窗 Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #fff0f3;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.3rem;
            color: #c9184a;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #aaa;
            cursor: pointer;
        }

        .cart-item-list {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #ffccd5;
        }

        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item-img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
        }

        .remove-btn {
            background: #ffb3c1;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .locked-tag {
            font-size: 0.8rem;
            color: #c9184a;
            background: #ffe6ea;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        .custom-input {
            width: 100%;
            padding: 12px;
            border: 2px dashed #ff8fa3;
            border-radius: 15px;
            box-sizing: border-box;
            outline: none;
            font-size: 0.95rem;
            background: #fff8f9;
            color: var(--text-color);
            resize: none;
            margin-top: 10px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ff758f, #ff4d6d);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        .empty-cart-text {
            text-align: center;
            color: #ff8fa3;
            padding: 20px 0;
        }

        .loading-text {
            text-align: center;
            grid-column: span 2;
            color: #ff758f;
            padding: 20px;
        }

        /* 成功頁面樣式 */
        .success-page {
            display: none;
            text-align: center;
        }

        .order-badge {
            display: inline-block;
            background: #ffccd5;
            color: #c9184a;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .timer-box {
            background: #fff0f3;
            border: 2px dashed #ff4d6d;
            border-radius: 15px;
            padding: 10px;
            margin: 15px 0;
            color: #c9184a;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .order-summary-box {
            background: #fff0f3;
            border: 2px dashed #ff8fa3;
            border-radius: 18px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
        }

        .order-summary-title {
            font-weight: bold;
            color: #c9184a;
            border-bottom: 1px solid #ffccd5;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .order-detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .order-detail-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        .wish-text {
            background: #ffffff;
            padding: 10px;
            border-radius: 10px;
            color: #a4133c;
            font-size: 0.9rem;
            margin-top: 8px;
            word-break: break-all;
        }

        .btn-add-more {
            width: 100%;
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-add-more:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-reset {
            width: 100%;
            background: transparent;
            color: #ff758f;
            border: 1px dashed #ff758f;
            padding: 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<!-- 全局右上角固定貼圖 (你可以更換 src 裡的圖片連結) -->
<div class="fixed-sticker">
    <img src="https://i.imgur.com/RQ2lOfb.jpg" alt="吉祥物貼圖">
</div>

<!-- 1. 點餐主頁面 -->
<div class="container" id="mainPage">
    <h1>白白下一餐食D咩</h1>
    <div class="subtitle">想食乜嘢？撳選項加進購物車或者寫低許願想法！</div>

    <div class="section-title">🍱 今日特供菜單</div>
    <div class="menu-grid" id="menuGrid">
        <div class="loading-text">毛毛大廚正在為您加載今日菜單... 🍳</div>
    </div>
</div>

<!-- 底部懸浮購物車按鈕 -->
<button class="cart-float-btn" id="cartFloatBtn" onclick="openCart()">
    <span>🛒 查看購物車</span>
    <div>
        <span id="cartCount">已選 0 項</span>
    </div>
</button>

<!-- 購物車彈窗 Modal -->
<div class="modal-overlay" id="cartModal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title">🛍️ 白白嘅購物車</span>
            <button class="close-btn" onclick="closeCart()">&times;</button>
        </div>

        <div id="cartItemsContainer">
            <div class="empty-cart-text">購物車仲係空的喔！快啲揀幾樣心水菜式啦～ 💕</div>
        </div>

        <div class="section-title" style="margin-top: 15px;">✨ 額外許願池 / 點餐備註</div>
        <textarea id="customWish" class="custom-input" rows="3" placeholder="今天特別想食D乜？或者需要加辣/去冰？（加菜時可隨時補充備註喔～）"></textarea>

        <button class="btn-submit" id="submitBtn" onclick="submitOrder()">💖 送出菜單比毛毛大廚</button>
    </div>
</div>

<!-- 2. 下單成功明細頁面 -->
<div class="container success-page" id="successPage">
    <div style="font-size: 3rem;">🎉</div>
    <h1>點餐成功！</h1>
    <div class="order-badge" id="orderNumberDisplay">訂單號：#----</div>
    <div class="subtitle">毛毛大廚已收到你嘅菜單！👩‍🍳❤️</div>

    <div class="timer-box" id="timerBox">
        ⏳ 第一次下單 3 分鐘內可繼續加菜：<span id="countdown">03:00</span>
    </div>

    <div class="order-summary-box">
        <div class="order-summary-title">📋 目前已點總菜單</div>
        <div id="submittedItemsList"></div>
        
        <div class="order-summary-title" style="margin-top: 15px;">✨ 特別許願 / 備註內容</div>
        <div id="submittedWish" class="wish-text">無</div>
    </div>

    <button class="btn-add-more" id="addMoreBtn" onclick="backToMenuForMore()">➕ 仲想繼續加菜 / 修改備註</button>
    <button class="btn-reset" onclick="resetAllOrders()">🔄 開始新一輪點餐（重新計時）</button>
</div>

<script>
    const FORMSPREE_URL = "https://formspree.io/f/xbgjpddy"; 
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vROrrUIUq4xb815GEfQrz4ucj2unIsnmpahYl_q_Rne3VgguQxUME4jM0yS0nzUSalPi-ir9VfdfMEa/pub?output=csv";

    let menuItems = [];
    let selectedItems = [];
    let lockedItemNames = []; // 已經送出、被鎖定不可取消的菜色名稱列表

    // 訂單號與定時器變數
    let currentOrderNo = null;
    let emailTimer = null;
    let countdownInterval = null;
    let timeRemaining = 180; // 3 分鐘倒數 (秒)
    let isTimerRunning = false;

    // 生成不重複的 4 位數字訂單號 (0000 - 9999)
    function generateUniqueOrderNo() {
        let usedOrders = JSON.parse(localStorage.getItem('used_order_numbers') || '[]');
        if (usedOrders.length >= 10000) {
            usedOrders = []; // 滿 10000 次後重置循環
        }

        let num;
        do {
            num = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
        } while (usedOrders.includes(num));

        usedOrders.push(num);
        localStorage.setItem('used_order_numbers', JSON.stringify(usedOrders));
        return num;
    }

    // 從 Google 試算表讀取菜單 CSV
    async function loadMenuFromSheet() {
        try {
            const response = await fetch(SHEET_CSV_URL);
            const data = await response.text();
            
            const rows = data.split('\n').map(row => row.trim()).filter(row => row.length > 0);
            menuItems = [];

            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].split(',');
                if (cols[0]) {
                    menuItems.push({
                        name: cols[0].replace(/^"|"$/g, '').trim(),
                        img: cols[1] ? cols[1].replace(/^"|"$/g, '').trim() : ''
                    });
                }
            }
            renderMenu();
        } catch (error) {
            console.error("加載菜單失敗:", error);
            document.getElementById('menuGrid').innerHTML = '<div class="loading-text">菜單加載失敗，請稍後再試！</div>';
        }
    }

    // 渲染主頁菜單
    function renderMenu() {
        const grid = document.getElementById('menuGrid');
        grid.innerHTML = '';

        if (menuItems.length === 0) {
            grid.innerHTML = '<div class="loading-text">今天大廚休息或仲未有菜品揀喔！</div>';
            return;
        }

        menuItems.forEach((item) => {
            const isSelected = selectedItems.some(i => i.name === item.name);
            const isLocked = lockedItemNames.includes(item.name);
            
            const div = document.createElement('div');
            div.className = `menu-item ${isSelected ? 'selected' : ''} ${isLocked ? 'locked' : ''}`;
            
            // 已鎖定的菜色點擊時給予提示，無法取消
            div.onclick = () => {
                if (isLocked) {
                    alert(`「${item.name}」係上一輪已送出的菜色，無法取消喔～`);
                } else {
                    toggleSelect(item);
                }
            };
            
            const imgHtml = item.img ? `<img src="${item.img}" alt="${item.name}">` : '';
            let btnText = '+ 加進購物車';
            if (isLocked) {
                btnText = '🔒 已鎖定 (已送出)';
            } else if (isSelected) {
                btnText = '✓ 已加進購物車';
            }
            
            div.innerHTML = `
                <div>
                    ${imgHtml}
                    <div class="name">${item.name}</div>
                </div>
                <button class="btn-add">${btnText}</button>
            `;
            grid.appendChild(div);
        });

        updateCartUI();
    }

    // 切換選取狀態
    function toggleSelect(item) {
        const index = selectedItems.findIndex(i => i.name === item.name);
        if (index > -1) {
            selectedItems.splice(index, 1);
        } else {
            selectedItems.push(item);
        }
        renderMenu();
    }

    // 更新購物車顯示介面
    function updateCartUI() {
        document.getElementById('cartCount').innerText = `已選 ${selectedItems.length} 項`;
        
        const container = document.getElementById('cartItemsContainer');
        if (selectedItems.length === 0) {
            container.innerHTML = '<div class="empty-cart-text">購物車仲係空的喔！快啲揀幾樣心水菜式啦～ 💕</div>';
            return;
        }

        let html = '<ul class="cart-item-list">';
        selectedItems.forEach((item) => {
            const isLocked = lockedItemNames.includes(item.name);
            const imgHtml = item.img ? `<img src="${item.img}" class="cart-item-img">` : '';
            
            // 如果已鎖定，不顯示刪除按鈕，改顯示鎖定標籤
            const actionBtnHtml = isLocked 
                ? `<span class="locked-tag">🔒 已鎖定</span>`
                : `<button class="remove-btn" onclick="removeFromCart('${item.name}')">刪除</button>`;

            html += `
                <li class="cart-item">
                    <div class="cart-item-info">
                        ${imgHtml}
                        <span>${item.name}</span>
                    </div>
                    ${actionBtnHtml}
                </li>
            `;
        });
        html += '</ul>';
        container.innerHTML = html;
    }

    function removeFromCart(itemName) {
        if (lockedItemNames.includes(itemName)) {
            alert("已送出的菜色無法取消喔！");
            return;
        }
        selectedItems = selectedItems.filter(i => i.name !== itemName);
        renderMenu();
    }

    function openCart() {
        document.getElementById('cartModal').style.display = 'flex';
    }

    function closeCart() {
        document.getElementById('cartModal').style.display = 'none';
    }

    window.onclick = function(event) {
        const modal = document.getElementById('cartModal');
        if (event.target === modal) {
            closeCart();
        }
    }

    // 點擊送出菜單
    function submitOrder() {
        const customWish = document.getElementById('customWish').value.trim();

        if (selectedItems.length === 0 && !customWish) {
            alert("bb豬，你仲未揀任何想食嘅嘢喔！揀一個喇～ 💕");
            return;
        }

        // 將目前所有選取的菜色鎖定，防取消
        selectedItems.forEach(item => {
            if (!lockedItemNames.includes(item.name)) {
                lockedItemNames.push(item.name);
            }
        });

        // 如果是全新的一單，生成新訂單號並啟動倒數
        if (!currentOrderNo) {
            currentOrderNo = generateUniqueOrderNo();
            startThreeMinuteTimer();
        } else {
            // 如果是加菜，重新安排 3 分鐘後發送（但維持同一個訂單號與初始倒數）
            resetEmailDelayTask();
        }

        showSuccessPage(customWish);
    }

    // 啟動 3 分鐘倒數計時與延遲發送
    function startThreeMinuteTimer() {
        isTimerRunning = true;
        timeRemaining = 180;
        
        updateCountdownUI();

        clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            timeRemaining--;
            updateCountdownUI();

            if (timeRemaining <= 0) {
                clearInterval(countdownInterval);
                isTimerRunning = false;
                document.getElementById('timerBox').innerHTML = "✅ 訂單已封單並已成功發送給毛毛大廚！";
                document.getElementById('addMoreBtn').disabled = true;
                document.getElementById('addMoreBtn').innerText = "🔒 已超過 3 分鐘，無法繼續加菜";
            }
        }, 1000);

        resetEmailDelayTask();
    }

    // 重設 3 分鐘發送任務（有加菜時重新計算 3 分鐘，確保發送最終版）
    function resetEmailDelayTask() {
        if (emailTimer) clearTimeout(emailTimer);

        // 預約 3 分鐘 (180,000 毫秒) 後真正發送 Email
        emailTimer = setTimeout(() => {
            sendFinalEmail();
        }, 180000);
    }

    // 更新倒數文字顯示
    function updateCountdownUI() {
        const mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        const secs = (timeRemaining % 60).toString().padStart(2, '0');
        document.getElementById('countdown').innerText = `${mins}:${secs}`;
    }

    // 真正的 Email 發送函數 (向 Formspree 提交)
    async function sendFinalEmail() {
        const customWish = document.getElementById('customWish').value.trim();
        const selectedNames = selectedItems.map(i => i.name).join(", ");

        try {
            await fetch(FORMSPREE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "訂單編號": `#${currentOrderNo}`,
                    "選取的菜餚": selectedNames || "無",
                    "特別許願/備註": customWish || "無",
                    "下單時間": new Date().toLocaleString()
                })
            });
            console.log("Email 已於 3 分鐘後成功發送最終版本！");
        } catch (error) {
            console.error("發送 Email 失敗:", error);
        }
    }

    // 顯示成功頁面
    function showSuccessPage(wishText) {
        document.getElementById('orderNumberDisplay').innerText = `訂單號：#${currentOrderNo}`;

        const itemsListContainer = document.getElementById('submittedItemsList');
        if (selectedItems.length > 0) {
            let html = '';
            selectedItems.forEach(item => {
                const imgHtml = item.img ? `<img src="${item.img}" class="order-detail-img">` : '';
                html += `
                    <div class="order-detail-item">
                        ${imgHtml}
                        <span>${item.name}</span>
                    </div>
                `;
            });
            itemsListContainer.innerHTML = html;
        } else {
            itemsListContainer.innerHTML = '<div style="color: #666; font-size: 0.9rem;">未選擇固定菜色</div>';
        }

        document.getElementById('submittedWish').innerText = wishText || "無特別許願/備註內容～";

        closeCart();
        document.getElementById('mainPage').style.display = 'none';
        document.getElementById('cartFloatBtn').style.display = 'none';
        document.getElementById('successPage').style.display = 'block';
    }

    // 返回點餐主頁加菜
    function backToMenuForMore() {
        if (!isTimerRunning) {
            alert("已超過 3 分鐘加菜時間，如需點餐請點擊「開始新一輪點餐」！");
            return;
        }
        document.getElementById('successPage').style.display = 'none';
        document.getElementById('mainPage').style.display = 'block';
        document.getElementById('cartFloatBtn').style.display = 'flex';
        renderMenu();
    }

    // 重置所有訂單（開啟新一輪）
    function resetAllOrders() {
        if (emailTimer) clearTimeout(emailTimer);
        if (countdownInterval) clearInterval(countdownInterval);

        currentOrderNo = null;
        isTimerRunning = false;
        selectedItems = [];
        lockedItemNames = []; // 清空鎖定菜色
        document.getElementById('customWish').value = '';
        
        document.getElementById('addMoreBtn').disabled = false;
        document.getElementById('addMoreBtn').innerText = "➕ 仲想繼續加菜 / 修改備註";
        document.getElementById('timerBox').innerHTML = '⏳ 第一次下單 3 分鐘內可繼續加菜：<span id="countdown">03:00</span>';

        document.getElementById('successPage').style.display = 'none';
        document.getElementById('mainPage').style.display = 'block';
        document.getElementById('cartFloatBtn').style.display = 'flex';
        renderMenu();
    }

    // 初始化菜單
    loadMenuFromSheet();
</script>

</body>
</html>
