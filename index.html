<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公主殿下的專屬點餐食堂 💖</title>
    <style>
        :root {
            --primary-color: #ff8fa3;
            --secondary-color: #ffb3c1;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #590d22;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(255, 143, 163, 0.3);
            border: 3px solid #ffccd5;
        }

        h1 {
            text-align: center;
            color: #c9184a;
            font-size: 1.6rem;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #ff4d6d;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1rem;
            color: #a4133c;
            margin-top: 20px;
            margin-bottom: 12px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .menu-item {
            background: #fff0f3;
            border: 2px solid #ffccd5;
            border-radius: 15px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-item.selected {
            background: var(--secondary-color);
            border-color: #ff4d6d;
            color: white;
        }

        .menu-item img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .menu-item .name {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .custom-input {
            width: 100%;
            padding: 12px;
            border: 2px dashed #ff8fa3;
            border-radius: 15px;
            box-sizing: border-box;
            outline: none;
            font-size: 0.95rem;
            background: #fff8f9;
            color: var(--text-color);
            resize: none;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ff758f, #ff4d6d);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👑 寶貝專屬點餐食堂</h1>
    <div class="subtitle">今天想吃什麼呢？點擊選擇或許願吧！</div>

    <div class="section-title">🍱 今日特供菜單 (可多選)</div>
    <div class="menu-grid" id="menuGrid"></div>

    <div class="section-title">✨ 額外許願池</div>
    <textarea id="customWish" class="custom-input" rows="3" placeholder="今天特別想吃什麼？例如：想喝半糖少冰波霸奶茶..."></textarea>

    <button class="btn-submit" id="submitBtn" onclick="submitOrder()">💖 送出菜單給專屬大廚</button>
</div>

<script>
    // ⚠️ 關鍵設定：請把下方引號內的網址換成你的 Formspree Endpoint 網址
    const FORMSPREE_URL = "https://formspree.io/f/xbgjpddy";

    let menuItems = [
        { id: 1, name: "紅燒牛腩飯 🍛", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300" },
        { id: 2, name: "奶油培根義大利麵 🍝", img: "https://images.unsplash.com/photo-1612874742237-6526221588e3?w=300" },
        { id: 3, name: "日式唐揚雞便當 🍱", img: "https://images.unsplash.com/photo-1562967914-608f82629710?w=300" },
        { id: 4, name: "愛心特製舒芙蕾 🥞", img: "https://images.unsplash.com/photo-1528207776546-365bb710ee93?w=300" }
    ];

    let selectedItems = [];

    function renderMenu() {
        const grid = document.getElementById('menuGrid');
        grid.innerHTML = '';
        menuItems.forEach(item => {
            const isSelected = selectedItems.includes(item.name);
            const div = document.createElement('div');
            div.className = `menu-item ${isSelected ? 'selected' : ''}`;
            div.onclick = () => toggleSelect(item.name);
            div.innerHTML = `<img src="${item.img}" alt="${item.name}"><div class="name">${item.name}</div>`;
            grid.appendChild(div);
        });
    }

    function toggleSelect(itemName) {
        if (selectedItems.includes(itemName)) {
            selectedItems = selectedItems.filter(name => name !== itemName);
        } else {
            selectedItems.push(itemName);
        }
        renderMenu();
    }

    async function submitOrder() {
        const customWish = document.getElementById('customWish').value.trim();

        if (selectedItems.length === 0 && !customWish) {
            alert("寶貝，你還沒有選任何想吃的東西喔！選一個吧～ 💕");
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "正在傳送給大廚中... 💌";

        try {
            const response = await fetch(FORMSPREE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "選取的菜餚": selectedItems.join(", ") || "無",
                    "特別許願": customWish || "無",
                    "點餐時間": new Date().toLocaleString()
                })
            });

            if (response.ok) {
                alert("🎉 點餐成功！專屬大廚已收到你的菜單，馬上為您準備！👩‍🍳❤️");
                selectedItems = [];
                document.getElementById('customWish').value = '';
                renderMenu();
            } else {
                alert("傳送失敗，請再試一次看看～");
            }
        } catch (error) {
            alert("網路連線有點問題，請稍後再試！");
        } finally {
            btn.disabled = false;
            btn.innerText = "💖 送出菜單給專屬大廚";
        }
    }

    renderMenu();
</script>

</body>
</html>
