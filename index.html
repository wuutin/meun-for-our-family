<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白白下一餐食D咩</title>
    <style>
        :root {
            --primary-color: #ff8fa3;
            --secondary-color: #ffb3c1;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #590d22;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(255, 143, 163, 0.3);
            border: 3px solid #ffccd5;
        }

        h1 {
            text-align: center;
            color: #c9184a;
            font-size: 1.6rem;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #ff4d6d;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1rem;
            color: #a4133c;
            margin-top: 20px;
            margin-bottom: 12px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .menu-item {
            background: #fff0f3;
            border: 2px solid #ffccd5;
            border-radius: 15px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-item.selected {
            background: var(--secondary-color);
            border-color: #ff4d6d;
            color: white;
        }

        .menu-item img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .menu-item .name {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .custom-input {
            width: 100%;
            padding: 12px;
            border: 2px dashed #ff8fa3;
            border-radius: 15px;
            box-sizing: border-box;
            outline: none;
            font-size: 0.95rem;
            background: #fff8f9;
            color: var(--text-color);
            resize: none;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ff758f, #ff4d6d);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading-text {
            text-align: center;
            grid-column: span 2;
            color: #ff758f;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>白白下一餐食D咩</h1>
    <div class="subtitle">想食乜嘢？撳選項或輸入你想食嘅野</div>

    <div class="section-title">🍱 今日特供菜單 </div>
    <div class="menu-grid" id="menuGrid">
        <div class="loading-text">毛毛大廚正在為您加載今日菜單... 🍳</div>
    </div>

    <div class="section-title">✨ 額外許願池</div>
    <textarea id="customWish" class="custom-input" rows="3" placeholder="今日特別想食D乜？例如：想飲一杯萬波...（唔可以）"></textarea>

    <button class="btn-submit" id="submitBtn" onclick="submitOrder()">💖 送出菜單畀老公</button>
</div>

<script>
    // ⚠️ 設定區：請填入你的連結
    const FORMSPREE_URL = "https://formspree.io/f/xbgjpddy"; // 你的 Formspree 接收網址
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vROrrUIUq4xb815GEfQrz4ucj2unIsnmpahYl_q_Rne3VgguQxUME4jM0yS0nzUSalPi-ir9VfdfMEa/pub?output=csv"; // 你的 Google 試算表 CSV 發佈網址

    let menuItems = [];
    let selectedItems = [];

    // 從 Google 試算表讀取菜單 CSV
    async function loadMenuFromSheet() {
        try {
            const response = await fetch(SHEET_CSV_URL);
            const data = await response.text();
            
            const rows = data.split('\n').map(row => row.trim()).filter(row => row.length > 0);
            menuItems = [];

            // 跳過第一行標題，從第二行開始解析
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].split(',');
                if (cols[0]) {
                    menuItems.push({
                        name: cols[0].replace(/^"|"$/g, '').trim(),
                        img: cols[1] ? cols[1].replace(/^"|"$/g, '').trim() : ''
                    });
                }
            }
            renderMenu();
        } catch (error) {
            console.error("加載菜單失敗:", error);
            document.getElementById('menuGrid').innerHTML = '<div class="loading-text">菜單加載失敗，請稍後再試！</div>';
        }
    }

    function renderMenu() {
        const grid = document.getElementById('menuGrid');
        grid.innerHTML = '';

        if (menuItems.length === 0) {
            grid.innerHTML = '<div class="loading-text">今日大廚休息或仲沒比菜品揀喔！</div>';
            return;
        }

        menuItems.forEach((item, index) => {
            const isSelected = selectedItems.includes(item.name);
            const div = document.createElement('div');
            div.className = `menu-item ${isSelected ? 'selected' : ''}`;
            div.onclick = () => toggleSelect(item.name);
            
            const imgHtml = item.img ? `<img src="${item.img}" alt="${item.name}">` : '';
            div.innerHTML = `${imgHtml}<div class="name">${item.name}</div>`;
            grid.appendChild(div);
        });
    }

    function toggleSelect(itemName) {
        if (selectedItems.includes(itemName)) {
            selectedItems = selectedItems.filter(name => name !== itemName);
        } else {
            selectedItems.push(itemName);
        }
        renderMenu();
    }

    async function submitOrder() {
        const customWish = document.getElementById('customWish').value.trim();

        if (selectedItems.length === 0 && !customWish) {
            alert("bb豬，你仲未揀任何想食嘅嘢喔！揀一個喇～ 💕");
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "傳送緊比大廚... 💌";

        try {
            const response = await fetch(FORMSPREE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "選取的菜餚": selectedItems.join(", ") || "無",
                    "特別許願": customWish || "無",
                    "點餐時間": new Date().toLocaleString()
                })
            });

            if (response.ok) {
                alert("🎉 點餐成功！毛毛大廚已收到你嘅菜單，即刻為你準備！👩‍🍳❤️");
                selectedItems = [];
                document.getElementById('customWish').value = '';
                renderMenu();
            } else {
                alert("傳送失敗，請試多一次喇～");
            }
        } catch (error) {
            alert("網路連線有問題，請稍後再試！");
        } finally {
            btn.disabled = false;
            btn.innerText = "💖 送出菜單比毛毛大廚";
        }
    }

    // 頁面開啟時自動載入菜單
    loadMenuFromSheet();
</script>

</body>
</html>
